"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
command_timeout = 800
scan_timeout = 30
palette = "tm"

format = "$hostname$os[](fg:os_bg bg:dir_bg)$directory$git_branch$git_commit$git_state$git_status[ ](fg:muted)"
right_format = "$status$cmd_duration$jobs$direnv$python$nodejs$golang$rust$ruby$java$lua$php$haskell$nix_shell$conda$terraform$kubernetes$aws$gcloud$azure$container${env_var.STARSHIP_VI_MODE}"
continuation_prompt = "[∙](fg:muted) "

[palettes.tm]
host_bg = "cyan"
host_fg = "black"
os_bg = "white"
os_fg = "black"
dir_bg = "blue"
dir_fg = "white"
git_bg = "green"
git_fg = "black"
muted = "bright-black"
status_bg = "bright-black"
success = "green"
error = "red"
yellow = "yellow"
green = "green"
cyan = "cyan"
blue = "blue"
purple = "purple"
red = "red"
violet = "purple"
dark = "black"
light = "white"

[os]
disabled = false
format = "[ $symbol ]($style)"
style = "fg:os_fg bg:os_bg"

[os.symbols]
Alpine = ""
Arch = ""
CentOS = ""
Debian = ""
Fedora = ""
Linux = ""
Macos = ""
Manjaro = ""
Mint = ""
NixOS = ""
Raspbian = ""
Redhat = ""
RedHatEnterprise = ""
Ubuntu = ""
Windows = ""

[directory]
format = "[ $path]($style)[$read_only]($read_only_style)[ ]($style)[](fg:dir_bg)"
home_symbol = "~"
read_only = " "
read_only_style = "fg:error bg:dir_bg"
repo_root_format = "[ $before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)[ ]($style)"
before_repo_root_style = "fg:dir_fg bg:dir_bg"
repo_root_style = "bold fg:dir_fg bg:dir_bg"
style = "fg:dir_fg bg:dir_bg"
truncate_to_repo = true
truncation_length = 4
truncation_symbol = "…/"

[git_branch]
always_show_remote = false
format = "[](fg:dir_bg bg:git_bg)[ $symbol$branch (:$remote_branch)]($style)"
style = "bold fg:git_fg bg:git_bg"
symbol = " "
truncation_length = 32
truncation_symbol = "…"

[git_commit]
commit_hash_length = 8
format = "[@$hash$tag]($style)"
only_detached = true
style = "bold fg:git_fg bg:git_bg"
tag_disabled = false
tag_symbol = "  "

[git_state]
format = "[$state( $progress_current/$progress_total)]($style)"
style = "bold fg:git_fg bg:git_bg"

[git_status]
format = "([$all_status$ahead_behind ]($style))[](fg:git_bg)"
style = "bold fg:git_fg bg:git_bg"
conflicted = "~${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[status]
disabled = false
format = "[ $symbol$common_meaning$signal_name$maybe_int ]($style)"
pipestatus = true
pipestatus_format = "[ $pipestatus ]($style)"
pipestatus_segment_format = "[$symbol$maybe_int]($style)"
map_symbol = true
symbol = "✘ "
success_symbol = "✔"
success_style = "fg:light bg:status_bg"
failure_style = "bold fg:error bg:status_bg"

[cmd_duration]
format = "[╱ $duration ]($style)"
min_time = 3000
show_milliseconds = false
style = "fg:dark bg:yellow"

[jobs]
format = "[╱ $symbol$number ]($style)"
style = "fg:dark bg:cyan"
number_threshold = 999
symbol = "⚙"
symbol_threshold = 1

[direnv]
disabled = true
format = "[╱ $symbol$loaded/$allowed ]($style)"
style = "fg:dark bg:yellow"
symbol = "direnv "

[python]
format = '[╱ ${symbol}${pyenv_prefix}(${version})(\($virtualenv\)) ]($style)'
style = "fg:dark bg:yellow"
symbol = " "

[nodejs]
disabled = true
format = "[╱ $symbol($version) ]($style)"
style = "fg:dark bg:green"
symbol = " "

[golang]
format = "[╱ $symbol($version) ]($style)"
style = "fg:dark bg:cyan"
symbol = " "

[rust]
disabled = true
format = "[╱ $symbol($version) ]($style)"
style = "fg:dark bg:red"
symbol = " "

[ruby]
format = "[╱ $symbol($version)(-$gemset) ]($style)"
style = "fg:dark bg:red"
symbol = " "

[java]
format = "[╱ $symbol($version) ]($style)"
style = "fg:dark bg:red"
symbol = " "

[lua]
format = "[╱ $symbol($version) ]($style)"
style = "fg:dark bg:blue"
symbol = " "

[php]
format = "[╱ $symbol($version)]($style)"
style = "fg:dark bg:purple"
symbol = " "

[haskell]
format = "[╱ $symbol($version)]($style)"
style = "fg:dark bg:purple"
symbol = " "

[nix_shell]
format = '[╱ $symbol$state(\($name\)) ]($style)'
style = "fg:dark bg:blue"
symbol = " "

[conda]
format = "[╱ $symbol$environment ]($style)"
ignore_base = true
style = "fg:dark bg:green"
symbol = " "

[terraform]
format = "[╱ $symbol$workspace ]($style)"
style = "fg:dark bg:violet"
symbol = " "

[kubernetes]
disabled = true
format = '[╱ $symbol$context(\($namespace\)) ]($style)'
style = "fg:dark bg:cyan"
symbol = "󱃾 "

[aws]
format = "[╱ $symbol($profile)(@$region) ]($style)"
style = "fg:dark bg:yellow"
symbol = "󰸏 "

[gcloud]
format = "[╱ $symbol$project ]($style)"
style = "fg:dark bg:blue"
symbol = "󱇶 "

[azure]
disabled = false
format = "[╱ $symbol$subscription ]($style)"
style = "fg:dark bg:blue"
symbol = "󰠅 "

[container]
format = "[╱ $symbol$name ]($style)"
style = "fg:dark bg:red"
symbol = "⬢ "

[hostname]
format = "[ $hostname ]($style)[](fg:host_bg bg:os_bg)"
ssh_only = true
style = "bold fg:host_fg bg:host_bg"
trim_at = "."

[env_var.STARSHIP_VI_MODE]
format = "[╱ $env_value ]($style)"
style = "fg:light bg:status_bg"

[character]
disabled = true
